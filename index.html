<!DOCTYPE html>
<html lang="en">
<head>

    <link rel="stylesheet" href="style.css">

</head>
<body>
    <nav>
        <ul>
            <li>My_TicTacToe</li>
        </ul>
    </nav>
    <div class="gameContainer">

            <div class="box"><span class="boxText"></span></div>
            <div class="box"><span class="boxText"></span></div>
            <div class="box"><span class="boxText"></span></div>
            <div class="box"><span class="boxText"></span></div>
            <div class="box"><span class="boxText"></span></div>
            <div class="box"><span class="boxText"></span></div>
            <div class="box"><span class="boxText"></span></div>
            <div class="box"><span class="boxText"></span></div>
            <div class="box"><span class="boxText"></span></div>

        <div class="gameInfo">
            <h1>Welcome To TicTacToe</h1>
            <img class="won" src="won.jpg" alt="" srcset="">

    <script src="script.js"></script>

</html>
